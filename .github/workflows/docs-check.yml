name: docs check

# Guards the public Plorea API docs (docs/plorea-api) before they ship:
# privacy patterns, a private denylist, HTML, links and every Mermaid diagram.
# See bin/check-docs for what each rule catches.

on:
  push:
    branches: [main]
    paths:
      - 'docs/plorea-api/**'
      - 'bin/check-docs'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - 'docs/plorea-api/**'
      - 'bin/check-docs'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  check:
    name: docs check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The optional denylist holds names that must not appear in the docs, so
      # it lives in a secret. When it is empty, the name check is skipped.
      - name: Privacy, HTML and links
        env:
          DOCS_DENYLIST: ${{ secrets.DOCS_DENYLIST }}
        run: bin/check-docs --mermaid-out "$RUNNER_TEMP/mermaid"

      # Mermaid is pinned to the version assets/docs.js loads; mermaid-cli alone
      # would pull the newest 10.x. Puppeteer uses the runner's Chrome.
      - name: Render Mermaid diagrams
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          printf '{"args":["--no-sandbox"],"executablePath":"%s"}' "$(command -v google-chrome)" > "$RUNNER_TEMP/puppeteer.json"
          npx -y -p @mermaid-js/mermaid-cli@10.9.1 -p mermaid@10.9.1 mmdc -q -p "$RUNNER_TEMP/puppeteer.json" \
            -i "$RUNNER_TEMP/mermaid/diagrams.md" -o "$RUNNER_TEMP/mermaid/out.md"
