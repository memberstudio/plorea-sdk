name: docs pages

# Publishes the static Plorea API docs (docs/plorea-api) to GitHub Pages.
# Only that folder is deployed; the SDK's Markdown docs stay in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'docs/plorea-api/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/plorea-api

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
