name: docs pages

# Publishes the static Plorea API docs (docs/plorea-api) to GitHub Pages.
# Only that folder is deployed; the SDK's Markdown docs stay in the repo.

on:
  push:
    branches: [main]
    paths:
      - 'docs/plorea-api/**'
      - '.github/workflows/docs-pages.yml'
      - 'bin/check-docs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    # A manual run can pick any branch; only main may publish.
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The same guard as the docs check workflow. Nothing is published if it
      # fails, so a privacy finding on main cannot reach the public site.
      - name: Privacy, HTML and links
        env:
          DOCS_DENYLIST: ${{ secrets.DOCS_DENYLIST }}
        run: bin/check-docs --mermaid-out "$RUNNER_TEMP/mermaid"

      # Mermaid is pinned to the version assets/docs.js loads; mermaid-cli alone
      # would pull the newest 10.x. Puppeteer uses the runner's Chrome.
      - name: Render Mermaid diagrams
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          printf '{"args":["--no-sandbox"],"executablePath":"%s"}' "$(command -v google-chrome)" > "$RUNNER_TEMP/puppeteer.json"
          npx -y -p @mermaid-js/mermaid-cli@10.9.1 -p mermaid@10.9.1 mmdc -q -p "$RUNNER_TEMP/puppeteer.json" \
            -i "$RUNNER_TEMP/mermaid/diagrams.md" -o "$RUNNER_TEMP/mermaid/out.md"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/plorea-api

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
